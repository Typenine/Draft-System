name: Materialized runtime audit

on:
  push:
    branches:
      - fix/polling-animation-layout
  pull_request:
    branches:
      - main

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: node scripts/materialize-draft-system.mjs --force
      - uses: actions/upload-artifact@v4
        with:
          name: materialized-runtime
          path: |
            src/components/draft-overlay/DraftOverlayLive.tsx
            src/components/draft-overlay/useDraftData.ts
            src/components/draft-overlay/EndOfRoundAnimation.tsx
            src/lib/draft-compat.ts
            src/lib/store/draft.ts
            src/app/api/draft/route.ts
            src/app/api/state/route.ts
            src/app/commissioner/page.tsx
            src/app/admin-enhancements.css
          if-no-files-found: error
