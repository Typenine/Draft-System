name: Assemble standalone project

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/ready'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decode project archive
        shell: bash
        run: |
          cat .bootstrap/part-* | base64 --decode > /tmp/draft-system.tar.gz
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .bootstrap -exec rm -rf {} +
          tar -xzf /tmp/draft-system.tar.gz -C .
          rm -rf .bootstrap
      - name: Commit assembled project
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Assemble standalone draft system"
          git push
