name: Typecheck diagnostic

on:
  pull_request:

permissions:
  contents: read

env:
  SOURCE_REPO: Typenine/East-v-West-Website
  SOURCE_REF: b003de3a44d8e399efeaed31412ba0880dff93c4

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - name: Capture typecheck
        id: typecheck
        continue-on-error: true
        run: npm run typecheck > typecheck-errors.txt 2>&1
      - uses: actions/upload-artifact@v4
        with:
          name: typecheck-errors
          path: typecheck-errors.txt
      - name: Fail when typecheck failed
        if: steps.typecheck.outcome == 'failure'
        run: exit 1
